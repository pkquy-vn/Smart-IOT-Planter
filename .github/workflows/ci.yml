name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

jobs:
  app:
    name: Mobile app (typecheck, lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plant-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plant-app/package-lock.json
      - run: npm ci
      - name: Generate Expo type declarations
        run: printf '/// <reference types="expo/types" />\n' > expo-env.d.ts
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings 0
      - run: npm test -- --ci

  firmware:
    name: Firmware (PlatformIO build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio
      - run: pio run -e esp32s3cam
