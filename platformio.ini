[env:esp32s3cam]
platform = espressif32
board = esp32s3box ; Update based on your exact ESP32-S3 CAM module (e.g., freenove_esp32_s3_wroom)
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep

; Many ESP32-S3 CAM boards use 8MB flash. Configure partitions to leave room for SPIFFS/LittleFS
board_build.partitions = default_8MB.csv 

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    WiFi
    FS
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    espressif/esp32-camera @ ^2.0.4
    ; Using a well-maintained fork of ESPAsyncWebServer for newer ESP-IDF compatibility
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
