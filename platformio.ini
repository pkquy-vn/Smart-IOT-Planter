[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
board_upload.flash_size = 8MB

; Configure memory type to correctly detect OPI PSRAM (Standard for 8MB S3 boards)
board_build.arduino.memory_type = qio_opi

; Many ESP32-S3 CAM boards use 8MB flash. Leave room for a future filesystem.
board_build.partitions = default_8MB.csv

build_flags =
    -DBOARD_HAS_PSRAM

; WiFi, FS and the esp32-camera driver are bundled with the Arduino-ESP32
; framework; listing them here (or a registry copy of esp32-camera) only
; risks header conflicts. The DHT is read with our own bit-banged driver.
lib_deps =
    ; Well-maintained fork of ESPAsyncWebServer for newer ESP-IDF compatibility
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
