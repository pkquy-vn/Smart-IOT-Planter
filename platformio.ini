[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
board_upload.flash_size = 8MB

; Configure memory type to correctly detect OPI PSRAM (Standard for 8MB S3 boards)
board_build.arduino.memory_type = qio_opi

; 8 MB flash: 3 MB app + ~4.9 MB LittleFS holding the web app (see the csv).
; Build the app into data/ with `npm run build:planter` (in plant-app/), then
; use PlatformIO's "Upload Filesystem Image".
board_build.partitions = partitions_8MB_app_fs.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM

; WiFi, FS and the esp32-camera driver are bundled with the Arduino-ESP32
; framework; listing them here (or a registry copy of esp32-camera) only
; risks header conflicts.
lib_deps =
    ; Well-maintained fork of ESPAsyncWebServer for newer ESP-IDF compatibility
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
    ; DS18B20 temperature probe (1-Wire)
    paulstoffregen/OneWire @ ^2.3.8
    milesburton/DallasTemperature @ ^4.0.4
