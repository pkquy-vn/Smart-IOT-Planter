[env:esp32s3cam]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep
board_upload.flash_size = 8MB

; Configure memory type to correctly detect OPI PSRAM (Standard for 8MB S3 boards)
board_build.arduino.memory_type = qio_opi

; Many ESP32-S3 CAM boards use 8MB flash. Configure partitions to leave room for SPIFFS/LittleFS
board_build.partitions = default_8MB.csv 

build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    WiFi
    FS
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    espressif/esp32-camera @ ^2.0.4
    ; Using a well-maintained fork of ESPAsyncWebServer for newer ESP-IDF compatibility
    mathieucarbou/ESPAsyncWebServer @ ^3.1.5
